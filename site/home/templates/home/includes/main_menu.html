{% load wagtailcore_tags %}
{% if items %}
    <nav class="main-menu" aria-label="Main">
        <ul>
            {% for item in items %}
                <li>
                    <a href="{% pageurl item.page %}"{% if item.active %} aria-current="page"{% endif %}>{{ item.page.title }}</a>
                </li>
            {% endfor %}
            <li><a href="{% url 'search' %}"{% if request.resolver_match.url_name == 'search' %} aria-current="page"{% endif %}>Search</a></li>
        </ul>
    </nav>
{% endif %}
