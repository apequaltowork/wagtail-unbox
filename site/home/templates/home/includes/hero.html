{% load wagtailimages_tags %}
{% if page.hero_image %}
    <figure class="hero">
        {% srcset_image page.hero_image fill-{800x350,1200x525,1600x700} sizes="(max-width: 46rem) 100vw, 46rem" alt=page.hero_alt %}
        {% if page.hero_caption %}
            <figcaption>{{ page.hero_caption }}</figcaption>
        {% endif %}
    </figure>
{% endif %}
